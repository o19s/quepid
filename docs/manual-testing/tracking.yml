        notes: "Reconfirmed via Playwright MCP on disposable case 6840 (no code changes to this area since the fix below): typed 500 into Number of Results to Show, clicked Rerun My Searches — flash 'Number of Results to Show must be between 1 and 100.', try count stayed at Try 3 (no new try created from the rejected save), confirming the fix described below still holds. Prior pass's notes: Endpoint Details (read-only name/URL + More link), Displayed Fields, Number of Results, Evaluate Nightly, Escape Queries, and the Search Endpoints picker all rendered correctly. CONFIRMED AND FIXED real bug: typing 500 into Number of Results (max=100) triggered AngularJS's built-in max validator, which sets the bound model to `undefined` while the input still visually showed '500' (no error styling anywhere in the template) — settingsSvc.js then dropped the undefined value from the POST body entirely, so Try#set_defaults (try.rb:247, `number_of_rows = 10 if blank?`) silently substituted 10 with zero user feedback. Root-caused via a code investigation, then fixed: added an explicit range check (1-100) at the top of SettingsCtrl.submit() (app/assets/javascripts/controllers/settings.js) that rejects out-of-range/non-numeric values with a clear flash error ('Number of Results to Show must be between 1 and 100.') and refuses to save, instead of silently defaulting; also added a matching `min=\"1\"` to the template input (devQueryParams.html) alongside the existing `max=\"100\"`. Rebuilt Angular bundles (yarn build:angular-app / build:angular-templates) and re-verified live: typing 500 now shows the error and leaves the try unchanged (no new try created, field still shows '500' so the user can correct it); typing a valid value (50) still saves correctly and round-trips via the API (`number_of_rows: 50` confirmed on the saved try). jshint clean on the modified file. No test coverage existed for SettingsCtrl (spec/javascripts/angular/controllers/settings_spec.js is a placeholder) — did not add new Karma tests given this is legacy AngularJS code being phased out, per the migration effort; scope kept to the minimal fix. Did not toggle Evaluate Nightly or verify a queued background job via Job Manager."
