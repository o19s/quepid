# Manual-testing coverage tracker.
#
# One entry per numbered scenario in docs/manual-testing/*.md (same numbering). Tracks when a
# scenario was last actually driven end-to-end (via Playwright MCP or by hand) so we know:
#
#   1. whether it's DUE for a rerun because related source files changed since last_run, and
#   2. whether it's STALE by pure time (rerun periodically even absent code changes — seed data,
#      dependencies, and external services like Ollama/Solr drift independently of app code).
#
# Update rules:
#   - After actually exercising a scenario: set last_run to today (UTC, YYYY-MM-DD), result to
#     pass / pass_with_fixes / fail / blocked, and a one-line note (what you did, what you found).
#   - If you skip a scenario, leave it alone — last_run: null means "never verified", which is
#     honest and useful. Don't backfill a date for something you didn't actually run.
#   - `paths` are repo-relative glob-ish hints at the source most likely to affect this scenario.
#     They're a best-effort heuristic for `bin/manual_test_status`, not exhaustive — improve them
#     when you learn a scenario touches a file this list is missing.
#   - result: pass_with_fixes means bugs were found AND fixed in the same pass (see notes for what).
#
# Check status: bin/manual_test_status  (or `bin/manual_test_status --due-only`)

policy:
  default_max_age_days: 90

