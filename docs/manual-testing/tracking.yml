        notes: "Follow-up investigation confirms the graph DOES render with an all-zero score history — it just isn't visible. Gating logic (qscore_case.html:2, `ng-if=\"ctrl.scores.length > 1\"`) has no zero/null/distinctness filter anywhere in the pipeline (qgraph_controller.js, case_scores_controller.rb, score.rb all checked). Built a throwaway case (rails runner) with 5 case_scores all score=0.0 and confirmed via screenshot + raw SVG inspection: the `<qgraph>` mounts and Vega renders a real path (`d=\"M0,72L35,72L...\"`, stroke `#4c78a8`) — but that path sits exactly on the bottom pixel row of the 72px drawable area (80px svg minus 4px+4px translate padding), which is where `qgraph svg { border: 2px solid grey }` (qscore.css:104) also sits. The blue line is visually swallowed by the grey border, reading as 'nothing rendered' even though it's technically there. Confirmed by contrast: case 6, which has real varied non-zero score history (0.10 → 1.0), shows a clearly visible diagonal sparkline. So this is a real (minor) visual bug — a flat 0-score history gives no usable visual feedback — not a gating-logic bug and not a regression; not fixed (cosmetic, low-priority, and would need a design decision on how to make a flat-zero line visible, e.g. inset padding or a different baseline color). Cleaned up the throwaway case afterward. Annotation marker/tooltip behavior still not tested."
