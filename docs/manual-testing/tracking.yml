# Manual-testing coverage tracker.
#
# One entry per numbered scenario in docs/manual-testing/*.md (same numbering). Tracks when a
# scenario was last actually driven end-to-end (via Playwright MCP or by hand) so we know:
#
#   1. whether it's DUE for a rerun because related source files changed since last_run, and
#   2. whether it's STALE by pure time (rerun periodically even absent code changes — seed data,
#      dependencies, and external services like Ollama/Solr drift independently of app code).
#
# Update rules:
#   - After actually exercising a scenario: set last_run to a full UTC timestamp in
#     YYYY-MM-DDTHH:MM:SSZ format (e.g. 2026-09-09T15:47:00Z) — NOT a bare date. This must parse
#     as a YAML timestamp (Ruby Time), not a plain Date or String; unquoted "YYYY-MM-DD HH:MM"
#     without seconds+zone silently parses as a String and breaks bin/manual_test_status. Date-only
#     granularity can't tell "verified this morning" from "edited again this afternoon" on the same
#     day — exactly the case that causes redundant or missed reruns — so always include the time.
#     Also set result to pass / pass_with_fixes / fail / blocked, and a `notes` entry (what you
#     did, what you found) — see the length guidance below.
#   - `notes` describes THE LATEST PASS ONLY, in the form "Covered live: ... Not covered live: ...".
#     Don't append this pass's narrative to the previous one — git log -p holds the history, and a
#     note that mixes passes leaves the reader unable to tell which sentence is still true.
#     Length follows what the pass actually found; bin/manual_test_status never reads notes, a
#     human does, so write for them:
#       - a clean pass is one or two sentences — what you drove, and what you didn't;
#       - a pass_with_fixes / fail earns as much room as it takes to say what broke, the cause,
#         and how the fix was verified. That detail is the whole value of the entry later, and is
#         why several notes here run long. Don't pad a routine pass to match them.
#   - Keep the actual test timestamp when committing. Clean files are due for code changes
#     only when both their edit and commit times are newer than last_run; dirty files use edit
#     time. See DEVELOPER_GUIDE.md's "Manual testing tracker" for the timestamp limitations.
#   - If you skip a scenario, leave it alone — last_run: null means "never verified", which is
#     honest and useful. Don't backfill a timestamp for something you didn't actually run.
#   - Older entries recorded before this rule (bare YYYY-MM-DD dates) are still valid and don't need
#     backfilling — bin/manual_test_status treats a bare date as the END of that UTC day, preserving
#     the same-day-doesn't-count-as-stale behavior these entries were written under. (Full-timestamp
#     entries compare at true precision, so this only matters for pre-existing bare-date entries.)
#   - `paths` are repo-relative glob-ish hints at the source most likely to affect this scenario.
#     They're a best-effort heuristic for `bin/manual_test_status`, not exhaustive — improve them
#     when you learn a scenario touches a file this list is missing.
#   - result: pass_with_fixes means bugs were found AND fixed in the same pass (see notes for what).
#
# Check status: bin/manual_test_status  (or `bin/manual_test_status --due-only`)

policy:
  default_max_age_days: 90

