    file: 16-cross-cutting-bs5-responsive-and-accessibility.md
    scenarios:
      "16.1":
        title: "Popover & tooltip paint check (BS3↔BS5 trap)"
        last_run: 2026-09-21T19:36:00Z
        result: pass
        notes: "Covered live: Playwright MCP, computed styles read from the live elements. Rating-badge popover at the default viewport: display block, opacity 1, transform a pure translation with no scale(0), font-size 14px against a 14px root (proportionate, not collapsed to a legacy fixed px) - and visible on the FIRST click. Re-checked at the 768x900 narrow viewport with the same result, so RFS scaling does not break it. A BS5 tooltip was also checked: display block, opacity 0.9 (Bootstrap's default, not stuck at 0), visible."
        paths: ["app/javascript/controllers/bs_popover_controller.js", "app/javascript/controllers/bs_tooltip_controller.js", "app/assets/stylesheets/bootstrap5-compat.css", "app/javascript/utils/bs_popover.js", "app/javascript/utils/bs_tooltip.js"]
      "16.2":
        title: "Narrow viewport reflow sweep"
        last_run: 2026-09-25T16:03:00Z
        result: pass_with_fixes
        notes: "CONFIRMED AND FIXED. Re-verified via Playwright MCP at 768x900 after today's navbar-toggler/BS5-spacing commit (b85bc847). Confirmed good: the Rails header's hamburger ('Toggle navigation') opens a clean stacked nav, and the Angular core case-workbench header collapses the same way with the toolbar wrapping cleanly (case 6, no overflow). Found a real bug and traced its origin precisely (not pre-existing as first assumed): the Cases list page (/cases) overflowed horizontally at 768px — the pre-Angular-removal cases list (deleted `case_listing.html`/`components/case_listing`) laid out each row with Bootstrap's responsive `row`/`col-xs-N` grid (no `<table>` at all); the Rails rewrite in `e52cec3a` ('Migrate teams, scorers and case listings away from angularjs') replaced that with a rigid 11-column `<table>` and never added a `.table-responsive` wrapper, so the migration itself dropped the old layout's responsiveness. Fixed by wrapping the `<table>` in `app/views/cases/index.html.erb` with `<div class=\"table-responsive\">`. Verified at 768px: `window.scrollX` can no longer move (page itself doesn't scroll horizontally), the table now scrolls internally within its own bounded box, and a full-page screenshot confirms no page-level scrollbar. Verified at 1280px desktop width: full table still renders normally, unaffected. (Note: `document.documentElement.scrollWidth` still reads ~930 after the fix due to a `.card` being `display:flex` with a nested `overflow-x:auto` descendant — a known scrollWidth-measurement quirk, not an actual scrollable page; confirmed via `window.scrollX`/screenshot instead.) Other wide list tables (Search Endpoints, Scorers, Books, Admin Users) may share the same unwrapped-table pattern from other Angular-removal migrations — not individually checked this pass, so not confirmed either way. Wizard endpoint-step accordion at 768px not re-tested this pass."
        paths: ["app/views/layouts/_header.html.erb", "app/views/layouts/_header_core_app.html.erb", "app/assets/stylesheets/navbar-brand.css", "app/assets/stylesheets/bootstrap5-compat.css", "app/views/cases/index.html.erb"]
      "16.3":
        title: "Case header typography"
        last_run: 2026-09-25T16:03:00Z
        result: pass
        notes: "Re-verified via Playwright MCP: measured via getComputedStyle on case 6's header — h1 font-size 35px, small font-size 30.625px, ratio exactly 0.875, matching the expected fix."
        paths: ["app/assets/stylesheets/bootstrap5-compat.css"]
      "16.4":
        title: "Modal accessibility spot-check"
        last_run: 2026-09-25T16:02:49Z
        result: pass
