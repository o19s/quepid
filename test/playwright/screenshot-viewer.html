<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quepid screenshot viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --panel: #1a1e28;
        --border: #2c3344;
        --text: #e8ecf4;
        --muted: #9aa3b5;
        --accent: #5b9fd4;
        --accent-soft: #243548;
        --ok: #3ecf8e;
        --warn: #f0b429;
        --diff: #ff4d8d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      .layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      aside {
        border-right: 1px solid var(--border);
        background: var(--panel);
        padding: 1rem;
        overflow: auto;
      }

      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.5rem;
        align-items: center;
        justify-content: space-between;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .meta {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .meta a,
      .history-link {
        color: var(--accent);
      }

      .baseline-tabs {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem 1.25rem 0;
      }

      .baseline-tabs button {
        padding: 0.4rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }

      .baseline-tabs[hidden] {
        display: none;
      }

      .baseline-tabs button[aria-selected="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .search {
        width: min(320px, 100%);
        padding: 0.45rem 0.65rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }

      .nav-section {
        margin-bottom: 1.25rem;
      }

      .nav-section .nav-section {
        margin: 0.75rem 0 0.75rem 0.75rem;
      }

      .nav-section summary {
        margin: 0 0 0.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
      }

      .nav-section summary:hover,
      .nav-section summary:focus-visible {
        color: var(--text);
      }

      .nav-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.25rem;
      }

      .nav-list button {
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text);
        padding: 0.45rem 0.55rem;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .nav-list button:hover,
      .nav-list button:focus-visible {
        background: var(--accent-soft);
        outline: none;
      }

      .nav-list button[aria-current="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .badge {
        display: inline-block;
        flex-shrink: 0;
        padding: 0.05rem 0.4rem;
        border-radius: 999px;
        font-size: 0.68rem;
        border: 1px solid var(--border);
        white-space: nowrap;
      }

      .badge.identical {
        color: var(--ok);
        border-color: color-mix(in srgb, var(--ok) 50%, var(--border));
      }

      .badge.diff {
        color: var(--diff);
        border-color: color-mix(in srgb, var(--diff) 50%, var(--border));
      }

      .badge.single {
        color: var(--muted);
      }

      .report {
        margin-bottom: 1rem;
        padding: 0.85rem 1rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        display: grid;
        gap: 0.45rem;
      }

      .report strong {
        font-size: 0.95rem;
      }

      .report.identical {
        border-color: color-mix(in srgb, var(--ok) 40%, var(--border));
      }

      .report.diff {
        border-color: color-mix(in srgb, var(--diff) 40%, var(--border));
      }

      .report.warn {
        border-color: color-mix(in srgb, var(--warn) 40%, var(--border));
      }

      .report dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.2rem 1rem;
        font-size: 0.85rem;
      }

      .report dt {
        color: var(--muted);
      }

      .report dd {
        margin: 0;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: center;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }

      .stage {
        flex: 1;
        padding: 1rem 1.25rem 1.5rem;
        overflow: auto;
      }

      .compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        align-items: start;
      }

      .compare.single {
        grid-template-columns: 1fr;
        max-width: 960px;
      }

      .compare.diff-row {
        grid-template-columns: 1fr;
        margin-top: 1rem;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: #0d0f14;
      }

      .panel header {
        padding: 0.55rem 0.75rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.8rem;
        color: var(--muted);
        justify-content: flex-start;
      }

      .panel img,
      .panel canvas {
        display: block;
        width: 100%;
        height: auto;
        max-width: 100%;
        cursor: zoom-in;
        background: #0a0c10;
      }

      .panel header .raw-link {
        margin-left: auto;
        color: var(--accent);
      }

      /* Changed-region boxes, positioned in percentages of the screenshot so
         they stay aligned at any rendered size. */
      .shot {
        position: relative;
      }

      .region {
        position: absolute;
        outline: 3px solid var(--diff);
        box-shadow: 0 0 0 4px #000, inset 0 0 0 1px #fff;
        pointer-events: none;
      }

      .region span {
        position: absolute;
        top: -3px;
        left: -3px;
        transform: translateY(-100%);
        padding: 0 0.3rem;
        background: var(--diff);
        color: #000;
        font-size: 0.7rem;
        font-weight: 700;
      }

      .hide-regions .region {
        display: none;
      }

      .compare.actual {
        grid-template-columns: 1fr;
      }

      .compare.actual .shot {
        width: fit-content;
      }

      .compare.actual .panel img,
      .compare.actual .panel canvas {
        width: auto;
        max-width: none;
        cursor: zoom-out;
      }

      .compare.actual .panel {
        overflow: auto;
      }

      .compare.actual .panel header {
        position: sticky;
        left: 0;
      }

      .slider {
        --pos: 50%;
      }

      .slider .slider-after {
        position: absolute;
        inset: 0;
        height: 100%;
        clip-path: inset(0 0 0 var(--pos));
      }

      .slider::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--pos);
        border-left: 2px solid var(--warn);
        pointer-events: none;
      }

      .slider-range {
        width: 100%;
        margin: 0.5rem 0;
      }

      .region-list {
        margin: 0;
        padding-left: 1.4rem;
        font-size: 0.85rem;
        columns: 2;
      }

      .panel .img-error {
        padding: 1rem;
        color: var(--diff);
        font-size: 0.85rem;
      }

      .empty {
        color: var(--muted);
        padding: 2rem;
        border: 1px dashed var(--border);
        border-radius: 10px;
      }

      .hint {
        margin-top: 0.75rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: none;
          border-bottom: 1px solid var(--border);
          max-height: 40vh;
        }

        .compare {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <div id="topic-navs"></div>
        <details class="nav-section" id="singles-nav" data-section="singles">
          <summary>Single shots</summary>
          <ul class="nav-list" id="singles-list"></ul>
        </details>
      </aside>
      <main>
        <header>
          <div>
            <h1 id="title">Screenshot viewer</h1>
            <div class="meta" id="subtitle">Loading manifest…</div>
            <div class="meta" id="capture-info"></div>
          </div>
          <a class="history-link" id="archive-link" href="?view=archive">Archive</a>
          <input class="search" id="search" type="search" placeholder="Filter screenshots…" />
        </header>
        <div class="baseline-tabs" id="baseline-tabs" role="tablist" aria-label="Left comparison" hidden></div>
        <div class="stage" id="stage">
          <div class="empty">Pick a screenshot set from the sidebar.</div>
        </div>
      </main>
    </div>

    <script>
      const manifestUrl = "screenshot-manifest.json"
      const shotPrefix = "/.playwright-mcp/"
      const PIXEL_THRESHOLD = 8
      const params = new URLSearchParams(window.location.search)
      const archiveView = params.get("view") === "archive"
      const historyScreen = params.get("screen")

      let manifest = { groups: [], singles: [], summary: {} }
      let items = []
      let activeId = null
      let viewMode = "side"
      let showRegions = true
      const pixelCache = new Map()
      const expandedSections = new Map()
      let navFiltered = false
      const baselineModes = new Map()
      let stageRenderVersion = 0

      function shotSrc(relPath) {
        return (
          shotPrefix +
          String(relPath)
            .split("/")
            .map((part) => encodeURIComponent(part))
            .join("/")
        )
      }

      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`
        return `${(bytes / 1024).toFixed(1)} KB`
      }

      function topicRank(topic) {
        if (topic === "share-case") return 0
        if (topic === "(root)") return 90
        if (topic === "prior") return 100
        return 50
      }

      function pairBadge(item) {
        if (item.byteIdentical) {
          return '<span class="badge identical">byte =</span>'
        }
        const diff = item.diff
        if (!diff || diff.error) return '<span class="badge diff">bytes ≠</span>'
        if (diff.dimensionMismatch) return '<span class="badge diff">size ≠</span>'
        if (diff.pixelIdentical) return '<span class="badge identical">pixel =</span>'
        const count = diff.regions.length
        return `<span class="badge diff">${count} box${count === 1 ? "" : "es"}</span>`
      }

      function hasRegions(item) {
        return Boolean(item?.diff?.regions?.length)
      }

      function regionsHtml(item) {
        if (!hasRegions(item)) return ""
        const { width, height } = item.diff
        return item.diff.regions
          .map(
            (r, index) => `
              <div class="region" style="left:${(r.x / width) * 100}%;top:${(r.y / height) * 100}%;width:${(r.width / width) * 100}%;height:${(r.height / height) * 100}%">
                <span>${index + 1}</span>
              </div>`
          )
          .join("")
      }

      function renderNav(filter = "") {
        if (!navFiltered) {
          document.querySelectorAll("details.nav-section").forEach((section) => {
            expandedSections.set(section.dataset.section, section.open)
          })
        }
        const q = filter.trim().toLowerCase()
        navFiltered = Boolean(q)
        const match = (item) =>
          !q ||
          item.title.toLowerCase().includes(q) ||
          item.id.toLowerCase().includes(q) ||
          (item.topic || "").toLowerCase().includes(q)

        const topicNavs = document.getElementById("topic-navs")
        const singlesList = document.getElementById("singles-list")
        topicNavs.innerHTML = ""
        singlesList.innerHTML = ""

        const pairs = items.filter((item) => (item.kind === "pair" || !archiveView) && match(item))
        const singles = archiveView ? items.filter((item) => item.kind === "single" && match(item)) : []

        const topics = [...new Set(pairs.map((p) => p.topic || "(root)"))].sort(
          (a, b) => topicRank(a) - topicRank(b) || a.localeCompare(b)
        )

        const topicSections = new Map()
        for (const topic of topics) {
          let parent = topicNavs
          let topicPath = ""
          for (const part of topic.split("/")) {
            topicPath = topicPath ? `${topicPath}/${part}` : part
            let section = topicSections.get(topicPath)
            if (!section) {
              section = document.createElement("details")
              section.className = "nav-section"
              section.dataset.section = `pair:${topicPath}`
              section.open = navFiltered || expandedSections.get(section.dataset.section) || false
              const summary = document.createElement("summary")
              summary.textContent = topicPath === "(root)" ? "Before / after (root)" : part
              section.appendChild(summary)
              parent.insertBefore(section, parent.querySelector(":scope > .nav-list"))
              topicSections.set(topicPath, section)
            }
            parent = section
          }
          const ul = document.createElement("ul")
          ul.className = "nav-list"
          for (const item of pairs.filter((p) => (p.topic || "(root)") === topic)) {
            const li = document.createElement("li")
            const btn = document.createElement("button")
            btn.type = "button"
            const label = document.createElement("span")
            label.textContent = item.title
            const badge = document.createElement("span")
            badge.innerHTML = item.captureStatus === "missing" ? '<span class="badge diff">capture missing</span>' : item.stale ? '<span class="badge diff">capture due</span>' : item.kind === "pair" ? pairBadge(item) : '<span class="badge single">first capture</span>'
            btn.append(label, badge)
            btn.setAttribute("aria-current", item.id === activeId ? "true" : "false")
            btn.addEventListener("click", () => select(item.id))
            li.appendChild(btn)
            ul.appendChild(li)
          }
          parent.appendChild(ul)
        }

        const singlesNav = document.getElementById("singles-nav")
        singlesNav.hidden = singles.length === 0
        singlesNav.open = navFiltered || expandedSections.get("singles") || false

        for (const item of singles) {
          const li = document.createElement("li")
          const btn = document.createElement("button")
          const topicLabel = item.topic && item.topic !== "(root)" ? `${item.topic}/` : ""
          btn.innerHTML = `<span>${topicLabel}${item.title}</span><span class="badge single">${item.note || "single"}</span>`
          btn.setAttribute("aria-current", item.id === activeId ? "true" : "false")
          btn.addEventListener("click", () => select(item.id))
          li.appendChild(btn)
          singlesList.appendChild(li)
        }
      }

      // Clicking a screenshot toggles the actual-size view, which keeps the
      // boxes; the header's raw PNG link opens the untouched file.
      function panel(label, src, alt, item = null) {
        const safeAlt = alt.replaceAll('"', "&quot;")
        return `
          <figure class="panel">
            <header>${label}<a class="raw-link" href="${src}" target="_blank" rel="noopener noreferrer">raw PNG</a></header>
            <div class="shot" data-toggle-actual>
              <img src="${src}" alt="${safeAlt}" loading="lazy"
                onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'img-error',textContent:'Failed to load: ${src}'}))" />
              ${regionsHtml(item)}
            </div>
          </figure>
        `
      }

      function sliderHtml(item) {
        const beforeSrc = shotSrc(item.before)
        const afterSrc = shotSrc(item.after)
        return `
          <figure class="panel">
            <header>${item.baselineLabel || "Before"} (left of the line) / ${archiveView ? "After" : "Current"} (right)</header>
            <div class="shot slider" id="slider">
              <img src="${beforeSrc}" alt="${item.title} before" />
              <img class="slider-after" src="${afterSrc}" alt="${item.title} after" />
              ${regionsHtml(item)}
            </div>
          </figure>
          <input class="slider-range" id="slider-pos" type="range" min="0" max="100" value="50" aria-label="Slider position" />
        `
      }

      function viewHtml(item) {
        const mode = viewMode === "slider" && item.diff?.dimensionMismatch ? "side" : viewMode
        if (mode === "slider") return sliderHtml(item)
        return `
          <div class="compare${mode === "actual" ? " actual" : ""}">
            ${panel(item.baselineLabel || "Before", shotSrc(item.before), `${item.title} before`, item)}
            ${panel(archiveView ? "After" : "Current", shotSrc(item.after), `${item.title} after`, item)}
          </div>
        `
      }

      function viewControlsHtml(item) {
        const option = (value, label, disabled = false) => `
          <label><input type="radio" name="view-mode" value="${value}" ${viewMode === value ? "checked" : ""} ${disabled ? "disabled" : ""} /> ${label}</label>`
        return `
          <div class="controls">
            ${option("side", "Side by side")}
            ${option("slider", "Slider", Boolean(item.diff?.dimensionMismatch))}
            ${option("actual", "Actual size")}
            ${hasRegions(item) ? `<label><input type="checkbox" id="show-regions" ${showRegions ? "checked" : ""} /> Boxes</label>` : ""}
            ${hasRegions(item) ? '<label><input type="checkbox" id="diff-only" /> Diff only (hide unchanged pixels)</label>' : ""}
            ${hasRegions(item) ? '<label><input type="checkbox" id="diff-overlay" checked /> Tint changed pixels</label>' : ""}
          </div>
        `
      }

      function reportHtml(item) {
        if (item.kind !== "pair") return ""

        if (item.byteIdentical) {
          return `
            <div class="report identical">
              <strong>Byte identical</strong>
              <dl>
                <dt>Files</dt><dd>${item.before} ↔ ${item.after}</dd>
                <dt>Size</dt><dd>${formatBytes(item.beforeSize)} each</dd>
                <dt>Pixels</dt><dd>Identical (same file bytes ⇒ same decoded image)</dd>
              </dl>
            </div>
          `
        }

        const diff = item.diff || { error: "manifest has no pixel diff; rerun yarn screenshots:view" }
        const bytes = `<dt>Bytes</dt><dd>Different (${formatBytes(item.beforeSize)} vs ${formatBytes(item.afterSize)})</dd>`

        if (diff.error) {
          return `
            <div class="report warn">
              <strong>Couldn't compare pixels</strong>
              <dl>${bytes}<dt>Reason</dt><dd>${diff.error}</dd></dl>
            </div>
          `
        }

        if (diff.dimensionMismatch) {
          return `
            <div class="report diff">
              <strong>Different dimensions</strong>
              <dl>
                ${bytes}
                <dt>Before</dt><dd>${diff.beforeWidth}×${diff.beforeHeight}</dd>
                <dt>After</dt><dd>${diff.afterWidth}×${diff.afterHeight}</dd>
              </dl>
            </div>
          `
        }

        if (diff.pixelIdentical) {
          return `
            <div class="report identical">
              <strong>Pixel identical (bytes differ)</strong>
              <dl>
                <dt>Bytes</dt><dd>Different PNG encoding (${formatBytes(item.beforeSize)} vs ${formatBytes(item.afterSize)})</dd>
                <dt>Dimensions</dt><dd>${diff.width}×${diff.height}</dd>
                <dt>Pixels</dt><dd>All channels match within threshold ${PIXEL_THRESHOLD}</dd>
              </dl>
            </div>
          `
        }

        const regions = diff.regions
          .map((r) => `<li>${r.width}×${r.height} at (${r.x}, ${r.y}), ${r.changedPixels.toLocaleString()} px changed</li>`)
          .join("")
        return `
          <div class="report diff">
            <strong>Visual diff detected: ${diff.regions.length} changed region${diff.regions.length === 1 ? "" : "s"}</strong>
            <dl>
              ${bytes}
              <dt>Dimensions</dt><dd>${diff.width}×${diff.height}</dd>
              <dt>Changed pixels</dt><dd>${diff.changedPixels.toLocaleString()} (${diff.changedPercent}%)</dd>
              <dt>Threshold</dt><dd>±${PIXEL_THRESHOLD} per RGBA channel</dd>
            </dl>
            <ol class="region-list">${regions}</ol>
          </div>
        `
      }

      async function loadImage(url) {
        const img = new Image()
        img.decoding = "async"
        img.src = url
        await img.decode()
        return img
      }

      function readPixels(img) {
        const canvas = document.createElement("canvas")
        canvas.width = img.naturalWidth
        canvas.height = img.naturalHeight
        const ctx = canvas.getContext("2d", { willReadFrequently: true })
        ctx.drawImage(img, 0, 0)
        return ctx.getImageData(0, 0, canvas.width, canvas.height)
      }

      function pixelDiff(beforeData, afterData, threshold) {
        const { width, height, data: a } = beforeData
        const b = afterData.data
        const diff = new Uint8ClampedArray(a.length)
        let changedPixels = 0

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4
            const dr = Math.abs(a[i] - b[i])
            const dg = Math.abs(a[i + 1] - b[i + 1])
            const db = Math.abs(a[i + 2] - b[i + 2])
            const da = Math.abs(a[i + 3] - b[i + 3])
            const changed = dr > threshold || dg > threshold || db > threshold || da > threshold

            if (changed) {
              changedPixels++
              diff[i] = 255
              diff[i + 1] = 77
              diff[i + 2] = 141
              diff[i + 3] = 255
            } else {
              diff[i] = 24
              diff[i + 1] = 28
              diff[i + 2] = 36
              diff[i + 3] = 255
            }
          }
        }

        const totalPixels = width * height
        return {
          width,
          height,
          changedPixels,
          changedPercent: ((changedPixels / totalPixels) * 100).toFixed(2),
          pixelIdentical: changedPixels === 0,
          imageData: new ImageData(diff, width, height)
        }
      }

      function overlayDiff(baseData, diffData, tintChanged) {
        const out = new Uint8ClampedArray(baseData.data)
        if (!tintChanged) return new ImageData(out, baseData.width, baseData.height)

        for (let i = 0; i < out.length; i += 4) {
          const changed =
            diffData.data[i] === 255 &&
            diffData.data[i + 1] === 77 &&
            diffData.data[i + 2] === 141

          if (changed) {
            out[i] = Math.min(255, out[i] * 0.35 + 255 * 0.65)
            out[i + 1] = Math.min(255, out[i + 1] * 0.35)
            out[i + 2] = Math.min(255, out[i + 2] * 0.35 + 141 * 0.35)
          }
        }

        return new ImageData(out, baseData.width, baseData.height)
      }

      // IMPORTANT: never assign canvas via innerHTML/outerHTML — that drops
      // putImageData pixels and leaves a blank canvas (broke pairs 05–08).
      function mountCanvas(container, imageData, label, item) {
        container.replaceChildren()
        const figure = document.createElement("figure")
        figure.className = "panel"
        const header = document.createElement("header")
        header.textContent = label
        const shot = document.createElement("div")
        shot.className = "shot"
        const canvas = document.createElement("canvas")
        canvas.width = imageData.width
        canvas.height = imageData.height
        // Keep CSS from collapsing the canvas before layout.
        canvas.style.aspectRatio = `${imageData.width} / ${imageData.height}`
        canvas.getContext("2d").putImageData(imageData, 0, 0)
        // Region boxes are static markup, so appending them after the canvas
        // is safe (the warning above is about the canvas itself).
        shot.append(canvas)
        shot.insertAdjacentHTML("beforeend", regionsHtml(item))
        figure.append(header, shot)
        container.appendChild(figure)
        return canvas
      }

      // Caches the promise, so revisiting a pair mid-load reuses it.
      function comparePair(item) {
        const key = `${item.before}\0${item.after}`
        if (!pixelCache.has(key)) pixelCache.set(key, readPair(item))
        return pixelCache.get(key)
      }

      async function readPair(item) {
        const [beforeImg, afterImg] = await Promise.all([loadImage(shotSrc(item.before)), loadImage(shotSrc(item.after))])

        if (beforeImg.naturalWidth !== afterImg.naturalWidth || beforeImg.naturalHeight !== afterImg.naturalHeight) {
          return { dimensionMismatch: true }
        }

        const beforeData = readPixels(beforeImg)
        const afterData = readPixels(afterImg)
        return {
          ...pixelDiff(beforeData, afterData, PIXEL_THRESHOLD),
          beforeData,
          afterData
        }
      }

      function wireDiffControls(pixel, item) {
        const diffOnly = document.getElementById("diff-only")
        const diffOverlay = document.getElementById("diff-overlay")
        const diffHost = document.getElementById("diff-canvas-host")
        const beforeHost = document.getElementById("before-canvas-host")
        const afterHost = document.getElementById("after-canvas-host")

        function redraw() {
          const showOverlay = diffOverlay?.checked ?? true
          const onlyDiff = diffOnly?.checked ?? false

          let diffImage = pixel.imageData
          if (onlyDiff) {
            const masked = new Uint8ClampedArray(pixel.imageData.data)
            for (let i = 0; i < masked.length; i += 4) {
              const changed = masked[i] === 255 && masked[i + 1] === 77
              if (!changed) masked[i + 3] = 0
            }
            diffImage = new ImageData(masked, pixel.width, pixel.height)
          }

          if (diffHost) {
            mountCanvas(diffHost, diffImage, `Diff map (${pixel.changedPercent}% changed)`, item)
          }

          if (beforeHost && afterHost) {
            mountCanvas(
              beforeHost,
              overlayDiff(pixel.beforeData, pixel.imageData, showOverlay),
              `${item.baselineLabel || "Before"} (tinted)`,
              item
            )
            mountCanvas(
              afterHost,
              overlayDiff(pixel.afterData, pixel.imageData, showOverlay),
              `${archiveView ? "After" : "Current"} (tinted)`,
              item
            )
          }
        }

        diffOnly?.addEventListener("change", redraw)
        diffOverlay?.addEventListener("change", redraw)
        redraw()
      }

      function wireViewControls(item) {
        const viewHost = document.getElementById("view-host")
        const stage = document.getElementById("stage")

        function wireSlider() {
          document.getElementById("slider-pos")?.addEventListener("input", (event) => {
            document.getElementById("slider").style.setProperty("--pos", `${event.target.value}%`)
          })
        }

        function setMode(mode) {
          viewMode = mode
          viewHost.innerHTML = viewHtml(item)
          for (const radio of document.querySelectorAll('input[name="view-mode"]')) radio.checked = radio.value === mode
          wireSlider()
        }

        for (const radio of document.querySelectorAll('input[name="view-mode"]')) {
          radio.addEventListener("change", () => setMode(radio.value))
        }
        document.getElementById("show-regions")?.addEventListener("change", (event) => {
          showRegions = event.target.checked
          stage.classList.toggle("hide-regions", !showRegions)
        })
        viewHost.addEventListener("click", (event) => {
          if (!event.target.closest("[data-toggle-actual]")) return
          setMode(viewMode === "actual" ? "side" : "actual")
        })
        wireSlider()
      }

      async function renderStage(item) {
        const renderVersion = ++stageRenderVersion
        const original = item
        const tabs = document.getElementById("baseline-tabs")
        tabs.replaceChildren()
        tabs.hidden = archiveView
        let baseline = baselineModes.get(item.id) || "previous"
        if (!archiveView) {
          for (const mode of ["previous", "legacy"]) {
            const button = document.createElement("button")
            button.type = "button"
            button.role = "tab"
            button.textContent = mode === "previous" ? "Previous" : "Legacy"
            button.setAttribute("aria-selected", String(mode === baseline))
            button.tabIndex = mode === baseline ? 0 : -1
            const change = () => {
              baselineModes.set(original.id, mode)
              renderStage(original)
              tabs.querySelector('[aria-selected="true"]').focus()
            }
            button.addEventListener("click", change)
            button.addEventListener("keydown", (event) => {
              if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
                event.preventDefault()
                event.stopPropagation()
                const next = event.key === "Home" ? "previous" : event.key === "End" ? "legacy" : mode === "previous" ? "legacy" : "previous"
                baselineModes.set(original.id, next)
                renderStage(original)
                tabs.querySelector('[aria-selected="true"]').focus()
              }
            })
            tabs.append(button)
          }
          if (baseline === "legacy" && item.legacyComparison) {
            item = { ...item, ...item.legacyComparison, kind: "pair", baselineLabel: "Legacy" }
          } else if (baseline === "legacy") {
            item = { ...item, kind: "single", image: item.now.image }
          } else {
            item = { ...item, baselineLabel: "Previous" }
          }
        }
        const stage = document.getElementById("stage")
        document.getElementById("title").textContent = item.title
        const info = document.getElementById("capture-info")
        info.replaceChildren()
        if (item.now) {
          const describe = (version) => `${version.capturedAt} · ${version.commit.slice(0, 8)}${version.dirty ? " + edits" : ""}`
          const before = item.versions.at(-2)
          info.append(`${baseline === "legacy" && item.legacy?.image ? `Legacy: ${item.legacy.ref.slice(0, 8)} · ` : before ? `Previous: ${describe(before)} · ` : ""}Current: ${describe(item.now)}${item.stale ? " · Relevant code changed; capture pending" : ""} · `)
          const link = document.createElement("a")
          link.href = `?view=archive&screen=${encodeURIComponent(item.screenId)}`
          link.textContent = `History (${item.versions.length})`
          info.append(link)
        }
        stage.classList.toggle("hide-regions", !showRegions)

        if (item.kind === "pair") {
          // Always keep the real <img> panels visible. The tinted canvases and
          // diff map are an extra row — never replace the photos with canvases.
          stage.innerHTML = `
            <div id="diff-report-wrap">${reportHtml(item)}</div>
            ${viewControlsHtml(item)}
            <div id="view-host">${viewHtml(item)}</div>
            <div class="compare" id="highlight-row" hidden>
              <div id="before-canvas-host"></div>
              <div id="after-canvas-host"></div>
            </div>
            <div class="compare diff-row" id="diff-row" hidden>
              <div id="diff-canvas-host"></div>
            </div>
            <p class="hint">Boxes mark clusters of changed pixels (±${PIXEL_THRESHOLD} per channel); they locate changes but don't replace looking at both images. Click a screenshot for actual size. Arrow keys: previous / next set.</p>
          `

          wireViewControls(item)
          if (!hasRegions(item)) return

          const pixel = await comparePair(item)
          if (activeId !== item.id || renderVersion !== stageRenderVersion || pixel.dimensionMismatch || pixel.pixelIdentical) return

          document.getElementById("highlight-row").hidden = false
          document.getElementById("diff-row").hidden = false
          wireDiffControls(pixel, item)
          return
        }

        let baselineMessage
        if (item.captureStatus === "missing") {
          baselineMessage = "The Current screenshot file is missing. Restore it to compare recorded captures."
        } else if (baseline === "legacy") {
          baselineMessage = item.legacy?.absent
            ? "This screen did not exist on the recorded legacy baseline."
            : item.legacy?.image
              ? "The recorded Legacy screenshot file is missing. Restore the original image."
              : "Legacy capture not recorded yet."
        } else {
          baselineMessage = item.versions?.at(-2)
            ? "The recorded Previous screenshot file is missing. Restore the original image."
            : "No previous code version has been captured yet."
        }
        stage.innerHTML = `
          <div class="compare${archiveView ? " single" : ""}">
            ${archiveView ? "" : `<figure class="panel"><header>${baseline === "legacy" ? "Legacy" : "Previous"}</header><div class="empty">${baselineMessage}</div></figure>`}
            ${panel(archiveView ? item.note || "Image" : "Current", shotSrc(item.image), item.title)}
          </div>
          <p class="hint">${archiveView ? "Single image — no pair to compare." : item.captureStatus === "missing" || (baseline === "legacy" ? item.legacy?.image : item.versions?.at(-2)) ? "Restore missing screenshot files to compare the recorded captures." : "The first capture establishes this screen’s history. Its next relevant code change will create a Previous / Current comparison."} Arrow keys: previous / next set.</p>
        `
      }

      function select(id) {
        const item = items.find((entry) => entry.id === id)
        if (!item) return
        activeId = id
        renderNav(document.getElementById("search").value)
        renderStage(item)
      }

      function selectRelative(delta) {
        const visible = items.filter((item) => {
          const q = document.getElementById("search").value.trim().toLowerCase()
          return !q || item.title.toLowerCase().includes(q) || item.id.toLowerCase().includes(q)
        })
        if (!visible.length) return
        const idx = Math.max(0, visible.findIndex((item) => item.id === activeId))
        const next = visible[(idx + delta + visible.length) % visible.length]
        select(next.id)
      }

      async function init() {
        const res = await fetch(manifestUrl)
        if (!res.ok) {
          document.getElementById("subtitle").textContent = "Manifest missing — run: yarn screenshots:view"
          document.getElementById("stage").innerHTML =
            '<div class="empty">Run <code>yarn screenshots:view</code> from the repo root to generate the manifest and start the local server.</div>'
          return
        }

        manifest = await res.json()
        const collection = archiveView ? manifest : manifest.current || { groups: [], singles: [] }
        items = [
          ...collection.groups.map((group) => ({ kind: "pair", ...group })),
          ...collection.singles.map((single) => ({ kind: "single", ...single })),
          ...(archiveView ? (manifest.history || []).map((single) => ({ kind: "single", ...single })) : [])
        ].filter((item) => !archiveView || !historyScreen || item.screenId === historyScreen)

        const archiveLink = document.getElementById("archive-link")
        if (archiveView) {
          archiveLink.href = "?"
          archiveLink.textContent = "Current screens"
        }

        const summary = manifest.summary || {}
        document.getElementById("subtitle").textContent =
          archiveView
            ? `${historyScreen ? "Screen history" : "Archive — older captures; legacy folders have no recorded source version"} · ${items.length} entries`
            : `${manifest.current?.branch || "Current branch"} · ${items.length} screens · Left: Previous or Legacy · Right: Current`

        renderNav()
        if (items.length) select(items[0].id)
        else {
          document.getElementById("stage").textContent = "No screens recorded for this branch yet. Record a capture with yarn screenshots:record; existing captures remain in Archive."
        }
      }

      document.getElementById("search").addEventListener("input", (event) => {
        renderNav(event.target.value)
      })

      window.addEventListener("keydown", (event) => {
        if (event.target.matches("input, textarea")) return
        if (event.key === "ArrowRight" || event.key === "ArrowDown") {
          event.preventDefault()
          selectRelative(1)
        }
        if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
          event.preventDefault()
          selectRelative(-1)
        }
      })

      init()
    </script>
  </body>
</html>
