<form class="vertically-centered gap-2">
  <div class="input-group">
    <input
      id="add-query"
      class="form-control"
      ng-model="ctrl.text"
      placeholder="{{ ctrl.message() }}"
      type="text"
     />

    <input
      id="add-query-submit"
      class="btn btn-success"
      ng-click="ctrl.submit()"
      ng-disabled="!ctrl.canAddQueries || ctrl.textInputIsEmpty()"
      type="submit"
      value="{{ ctrl.text.indexOf(';') === -1 ? 'Add query' : 'Add queries' }}"
     />
  </div>

  <i class="spinner" ng-class="{'d-none': !ctrl.loading}"></i>
</form>
