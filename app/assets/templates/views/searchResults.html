<div
  data-query-row-query-id-value="{{query.queryId}}"
  data-controller="query-row"
  data-query-row-rank-value="{{$index + 1}}"
  data-query-row-query-text-value="{{query.queryText}}"
  data-query-row-information-need-value="{{query.informationNeed}}"
  data-query-row-num-found-value="{{query.getNumFound()}}"
  data-query-row-querqy-triggered-value="{{querqyRuleTriggered()}}"
  data-query-row-state-value="{{query.state()}}"
  data-query-row-diff-value="{{displayed.results == displayed.resultsView.diffs && query.diffs}}"
  data-query-row-toggled-value="{{query.isToggled()}}"
  data-query-row-sorting-value="{{isSortingEnabled()}}">
  <div class="result-header" data-query-row-target="header">
    <!-- Current query score (Stimulus, store-driven — see
         docs/todo/angularjs_removal_inventory.md § Re-render mechanism, step 4) -->
    <div
      class="results-score qscore-query-badge"
      data-controller="qscore-query"
      data-qscore-query-query-id-value="{{query.queryId}}"
    >
      <span class="scorable-score" data-qscore-query-target="value"></span>
    </div>

    <!-- Snapshot query scores -->
    <qscore-query
      ng-if="query.diffs"
      ng-repeat="searcher in query.diffs.getSearchers() track by $index"
      class="results-score diff-score"
      max-score="maxScore || 100"
      scorable="searcher"
    >
    </qscore-query>

    <h2 class="results-title" data-action="click->query-row#toggle">
      <span class="query" data-controller="bs-tooltip" data-query-row-target="query" data-bs-tooltip-title-value="Info Need: {{query.informationNeed}}" data-bs-tooltip-delay-value="1000" data-bs-tooltip-placement-value="right">
        <img class="img-thumbnail query-thumbnail d-none" data-query-row-target="image"
             alt="">
        <span data-query-row-target="text">
          &nbsp;
        </span>
      </span>
    </h2>

    <span class="float-end total-results">
      <span data-query-row-target="resultCount" data-controller="count-up" data-count-up-number-value="{{query.getNumFound()}}"></span>
      <small class="text-muted" data-query-row-target="resultLabel">
      </small>
    </span>

    <i class="error-warning bi bi-exclamation-triangle-fill ms-2"
       role="img"
       aria-label="Query failed"
       title="Query failed"></i>

    <!-- Unrated-results frog badge (Stimulus, store-driven — see
         docs/todo/angularjs_removal_inventory.md § Re-render mechanism, step 5) -->
    <span
      class="float-end d-none"
      style="margin-right: 20px;"
      title="Hop to it!  There are unrated results!"
      data-controller="query-unrated-badge"
      data-query-unrated-badge-query-id-value="{{query.queryId}}"
    >
      <div class="icon-container">
        <i class="frog-icon">🐸</i>
        <div class="notification-bubble" data-query-unrated-badge-target="count"></div>
      </div>
    </span>


    <span class="float-end d-none" style="margin-right: 20px;" title="Querqy Strikes Again!" data-query-row-target="querqy">
      <i class="querqy-icon"></i>
    </span>

    <i class="toggleSign bi" data-query-row-target="toggle" data-action="click->query-row#toggle"></i>
  </div>

  <div ng-if="query.isToggled()" class="sub-results container-fluid">
    <div class="col-ratings query-rating">
      <strong>Score All</strong>
      <div class="ratings">
        <div class="single-rating" data-controller="rating-popover" data-rating-popover-scale-value="{{ (ratings.scale || {}) | json:0 }}">
          <span class="btn" ng-style="{rating: displayRating(), scale: ratings.scale} | ratingBgStyle">{{displayRating()}} <i class="bi bi-caret-down-fill"></i></span>
        </div>
      </div>
    </div>

    <div class="btn-toolbar" role="toolbar">
      <div class="btn-group me-2">
        <button class="btn btn-outline-secondary btn-sm" ng-click="copyQueryText()">
          <i
          class="bi bi-copy"
          aria-hidden="true"
          title="Copy query"
          alt="Copy query"></i></button>

      </div>

      <div class="btn-group me-2">
        <button class="btn btn-outline-secondary btn-sm" ng-click="displayed.notes = !displayed.notes">Toggle Notes</button>
      </div>

      <div class="btn-group me-2">
        <!--button class="btn btn-outline-secondary btn-sm" ng-class="{true: 'active', false: ''}[displayed.results == displayed.resultsView.results]" ng-click="displayed.results = displayed.resultsView.results">Current Top 10</button-->
        <query-explain query="query"></query-explain>
      </div>

      <div class="btn-group me-2">
        <button ng-controller="TargetedSearchCtrl" class="btn btn-outline-secondary btn-sm" ng-class="{true: 'active', false: ''}[displayed.results == displayed.resultsView.finder]" ng-click="targetedSearch.triggerModal()">Missing Documents</button>
      </div>

      <div class="btn-group me-2">
        <query-options query="query"></query-options>
      </div>

      <div class="btn-group">
        <move-query query="query"></move-query>
        <button class="btn btn-danger btn-sm" ng-click="removeQuery(query.queryId)">Delete Query</button>
      </div>

    </div>

    <!-- Query note taker -->
    <div ng-class="{true: 'notes-box', false: 'd-none'}[displayed.notes]">
      <div ng-controller="QueryNotesCtrl as ctrl" class="notes-content">
        <form ng-submit="saveNotes()">
          <div class="row mb-3">
            <label for="information-need" class="col-sm-2 col-form-label text-sm-end">Information Need</label>
            <div class="col-sm-10">
              <input type="text" ng-model="informationNeed" class="form-control" id="information" placeholder="Info Need:">
            </div>
          </div>
          <div class="row mb-3">
            <label for="notes" class="col-sm-2 col-form-label text-sm-end">Notes on this Query</label>
            <div class="col-sm-10">
              <textarea ng-model="queryNotes" id="notes" class="form-control"></textarea>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-sm-offset-2 offset-sm-2 col-sm-10">
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- unified diff display (handles both single and multiple snapshots) -->
    <div ng-controller="QueryDiffResultsCtrl" ng-if="displayed.results == displayed.resultsView.diffs">
      <query-diff-results query="query" repeatlength="10" max-score="maxScore">
        Diff Results
      </query-diff-results>
    </div>

    <div ng-if="query.state() === 'error'" class="alert alert-danger" ng-bind-html="query.errorText">
      {{query.errorText}}
    </div>

    <!-- Default search results -->
    <div ng-if="!queriesSvc.showOnlyRated" ng-show="displayed.results == displayed.resultsView.results">
      <search-result explain-viewport="'#query-container'" explain-view="'full'" class="search-result" ng-repeat="doc in query.docs track by doc.id" max-doc-score="query.maxDocScore()" doc="doc" field-spec="query.fieldSpec" rank="{{$index + 1}}" query="query" doc-id="doc.id">
      </search-result>

      <div class="row results-pane-footer">
        <i class="bi bi-caret-up-fill results-pane-toggle" ng-click="query.toggle()" data-controller="bs-popover" data-bs-popover-content-value="Close the results pane"></i>
        <span ng-if="query.numFound > query.docs.length && (selectedTry.searchEngine != 'searchapi' || selectedTry.mapperBasedSearchEngineSupportsPagination)">
          <a
            class="btn btn-outline-secondary"
            ng-click="query.paginate()"
          >
            Peek at the next page of results
          </a>
        </span>
        <span ng-if="selectedTry.searchEngine == 'solr' || (selectedTry.searchEngine == 'searchapi' && selectedTry.apiMethod == 'GET')">
          <browse-query query="query" selected-try="selectedTry"></browse-query>
        </span>

        <div ng-if="query.depthOfRating" class="alert alert-warning mb-0" role="alert">
          <strong>Note:</strong> Only the top {{query.depthOfRating}} results are used in the scoring calculations.
        </div>
      </div>
    </div>

    <!-- Rated only search results -->
    <div ng-if="queriesSvc.showOnlyRated" ng-show="displayed.results == displayed.resultsView.results">
      <search-result explain-viewport="'#query-container'" explain-view="'full'" class="search-result" ng-repeat="doc in query.ratedDocs track by doc.id" max-doc-score="query.maxDocScore()" doc="doc" field-spec="query.fieldSpec" rank="{{$index + 1}}" query="query" doc-id="doc.id">
      </search-result>

      <div class="row results-pane-footer">
        <i class="bi bi-caret-up-fill results-pane-toggle" ng-click="query.toggle()" data-controller="bs-popover" data-bs-popover-content-value="Close the results pane"></i>
        <span ng-if="query.getNumFound() > query.ratedDocs.length && (selectedTry.searchEngine != 'searchapi' || selectedTry.mapperBasedSearchEngineSupportsPagination)">
          <a
            ng-show="query.getNumFound() > query.ratedDocs.length"
            class="btn btn-outline-secondary"
            ng-click="query.ratedPaginate()"
          >
            Peek at the next page of results
          </a>
        </span>
        <span ng-if="selectedTry.searchEngine == 'solr' || (selectedTry.searchEngine == 'searchapi' && selectedTry.apiMethod == 'GET')">
          <browse-query query="query" selected-try="selectedTry"></browse-query>
        </span>

        <div class="alert alert-warning mb-0" role="alert">
          <strong>Note:</strong> You are only viewing documents that have been rated
        </div>
      </div>
    </div>

  </div>
</div>
