<!-- queriesCtrl.js is the ng-controller -->
<div id="main">
  <div class="pane_container">
    <div class="pane_main results-control">
      <div id="case-header" class="row">
        <div class="col-sm-12">
          <div style="display: inline-flex; align-items: flex-start;">
            <!-- Current case score -->
            <qscore-case
              annotations="annotations"
              class="case-score"
              max-score="maxScore || 1"
              scorable="queries.avgQuery"
              score-label="getScorer().name"
              scores="scores"
            >
            </qscore-case>

            <!-- Snapshot case scores -->
            <qscore-case
              ng-if="queries.avgQuery.diffs"
              ng-repeat="searcher in queries.avgQuery.diffs.getSearchers() track by $index"
              class="case-score diff-score"
              max-score="maxScore || 1"
              scorable="searcher"
              score-label="searcher.name()"
              scores="[]"
              annotations="[]"
            >
            </qscore-case>
          </div>

          <div ng-controller="CaseCtrl" style="display:inline-block;vertical-align:top">
            <h1 class="fs-1 fw-normal lh-sm mb-3">
              <small class="d-block fw-normal text-muted">
                Current case
                <i class="bi bi-repeat" ng-show="caseModel.selectedCase().nightly" data-controller="bs-tooltip" data-bs-tooltip-title-value="Queries are run on a nightly basis." data-bs-tooltip-delay-value="1000" data-bs-tooltip-placement-value="right"></i>
                <span ng-show="caseModel.selectedCase().public">PUBLIC</span>
                <span ng-show="caseModel.selectedCase().archived">ARCHIVED</span>
              </small>

              <span ng-dblclick="caseNameEditModeToggle()">
                <span ng-hide="caseName.startRename">
                  {{ caseModel.selectedCase().caseName }}
                </span>
                <span ng-show="caseName.startRename">
                  <form class="d-flex flex-wrap align-items-center gap-2" ng-submit="caseName.rename()">
                    <input style="background:#FFFF99" type="text" ng-model="caseName.name">
                    <input type="submit" class="btn btn-sm btn-primary" value="Rename" ng-disabled="!caseName.name || !caseName.name.trim()">
                    <button type="button" class="btn btn-sm btn-outline-secondary" ng-click="caseName.cancel()">Cancel</button>
                  </form>
                </span>
              </span>

              <small class="fw-normal text-muted" ng-controller="CurrSettingsCtrl">
                &mdash;
                <span ng-dblclick="tryNameEditModeToggle()">
                  <span ng-hide="tryName.startRename">
                    {{ currentTry.selectedTry().formattedName() }}
                  </span>
                </span>
                <span ng-show="tryName.startRename">
                  <form class="d-flex flex-wrap align-items-center gap-2" ng-submit="tryName.rename()">
                    <input style="background:#FFFF99" type="text" ng-model="tryName.name">
                    <input type="submit" class="btn btn-sm btn-primary" value="Rename" ng-disabled="!tryName.name || !tryName.name.trim()">
                    <button type="button" class="btn btn-sm btn-outline-secondary" ng-click="tryName.cancel()">Cancel</button>
                  </form>
                </span>
              </small>

              <small class="fw-normal text-muted">
                &mdash;
                {{ getScorer().name }}
              </small>
            </h1>
          </div>
        </div>
      </div>

      <div id="case-actions" class="row" ng-controller="CaseCtrl">
        <div class="col-sm-12" ng-if="caseModel.caseLoaded()">
          <ul class="list-inline">
            <li class="list-inline-item">
              <i class="bi bi-card-list"></i>
              <a
                href="#"
                data-controller="pick-scorer-core"
                data-action="click->pick-scorer-core#open"
                data-bs-toggle="modal"
                data-bs-target="#pickScorerModal"
                data-pick-scorer-core-id-value="{{ caseModel.selectedCase().caseNo }}"
                data-pick-scorer-core-current-scorer-id-value="{{ getScorer().scorerId }}"
                data-pick-scorer-core-current-scorer-name-value="{{ getScorer().name }}"
              >
                Select scorer
              </a>
            </li>
            <li class="list-inline-item">
              <i
                class="bi bi-book-half"
                aria-hidden="true"
                title="Judgements"
              ></i>
              <a
                href="#"
                data-controller="judgements-core"
                data-action="click->judgements-core#open"
                data-bs-toggle="modal"
                data-bs-target="#judgementsModal"
                data-judgements-core-id-value="{{ caseModel.selectedCase().caseNo }}"
                data-judgements-core-name-value="{{ caseModel.selectedCase().caseName }}"
                data-judgements-core-scorer-id-value="{{ caseModel.selectedCase().scorerId }}"
                data-judgements-core-book-id-value="{{ caseModel.selectedCase().bookId }}"
                data-judgements-core-queries-count-value="{{ caseModel.selectedCase().queriesCount }}"
                data-judgements-core-auto-populate-book-pairs-value="{{ caseModel.selectedCase().autoPopulateBookPairs }}"
                data-judgements-core-auto-populate-case-judgements-value="{{ caseModel.selectedCase().autoPopulateCaseJudgements }}"
              >
                Judgements
              </a>
            </li>
            <li class="list-inline-item">
              <i class="bi bi-camera-fill"></i>
              <a
                href="#"
                data-controller="take-snapshot-core"
                data-action="click->take-snapshot-core#open"
                data-bs-toggle="modal"
                data-bs-target="#takeSnapshotModal"
                data-take-snapshot-core-id-value="{{ caseModel.selectedCase().caseNo }}"
                data-take-snapshot-core-field-spec-value="{{ snapshotFieldSpec() }}"
                data-take-snapshot-core-search-engine-value="{{ snapshotSearchEngine() }}"
                data-take-snapshot-core-mapper-engine-name-value="{{ snapshotMapperEngineName() }}"
              >
                Create snapshot
              </a>
            </li>
            <li class="list-inline-item">
              <diff></diff>
            </li>
            <li class="list-inline-item">
              <import-ratings
                acase="caseModel.selectedCase()"
              ></import-ratings>
            </li>
            <li class="list-inline-item">
              <i
                class="bi bi-share-fill"
                aria-hidden="true"
                title="Share Case"
              ></i>
              <a
                href="#"
                data-controller="share-case-core"
                data-action="click->share-case-core#open"
                data-bs-toggle="modal"
                data-bs-target="#shareCaseModal"
                data-share-case-core-id-value="{{ caseModel.selectedCase().caseNo }}"
                data-share-case-core-name-value="{{ caseModel.selectedCase().caseName }}"
              >Share case</a>
            </li>
            <li class="list-inline-item">
              <i class="bi bi-copy" aria-hidden="true"></i>
              <a
                href="#"
                data-controller="clone-case-core"
                data-action="click->clone-case-core#open"
                data-bs-toggle="modal"
                data-bs-target="#cloneCaseModal"
                data-clone-case-core-id-value="{{ caseModel.selectedCase().caseNo }}"
                data-clone-case-core-name-value="{{ caseModel.selectedCase().caseName }}"
                data-clone-case-core-last-try-value="{{ caseModel.selectedCase().lastTry }}"
              >Clone</a>
            </li>
            <li class="list-inline-item">
              <i class="bi bi-x-lg" aria-hidden="true"></i>
              <a
                href="#"
                data-controller="delete-case-options-core"
                data-action="click->delete-case-options-core#open"
                data-bs-toggle="modal"
                data-bs-target="#deleteCaseOptionsModal"
                data-delete-case-options-core-id-value="{{ caseModel.selectedCase().caseNo }}"
                data-delete-case-options-core-name-value="{{ caseModel.selectedCase().caseName }}"
              >Delete</a>
            </li>
            <li class="list-inline-item">
              <i class="bi bi-file-earmark-arrow-up" aria-hidden="true"></i>
              <a
                href="#"
                data-controller="export-case-core"
                data-action="click->export-case-core#open"
                data-bs-toggle="modal"
                data-bs-target="#exportCaseModal"
                data-export-case-core-id-value="{{ caseModel.selectedCase().caseNo }}"
                data-export-case-core-name-value="{{ caseModel.selectedCase().caseName }}"
                data-export-case-core-supports-detailed-export-value="true"
              >Export</a>
            </li>
            <li class="list-inline-item" id="tune-relevance-link">
              <i class="bi bi-wrench-adjustable"></i>
              <a type="button" ng-click="toggleDevSettings()">
                Tune Relevance
              </a>
            </li>
          </ul>
        </div>
      </div> <!-- end of #case-actions -->

      <!-- see queries directive -->
      <queries></queries>

      <div ng-controller="WizardCtrl"></div>
    </div>

    <div class="east-slider">
    </div>

    <div class="pane_east">
      <ng-include src="'views/_dev_settings.html'"></ng-include>
    </div>
  </div>
</div>
