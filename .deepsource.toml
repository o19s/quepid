version = 1

exclude_patterns = [
  "node_modules/**",           # Dependencies
  "dist/**",                   # Build output
  "test/**",                   # Minitest and Vitest tests
  "spec/**",                   # Karma/legacy Angular tests
  "**/*.test.js",              # JavaScript unit tests wherever located
  "**/*.spec.js",              # Legacy JavaScript specs wherever located
  "app/assets/**",             # Legacy Angular/JSHint-managed assets and builds
  "app/javascript/vendor/**",  # Vendored JavaScript
  "public/javascripts/ace/**"  # Vendored Ace editor assets
]

test_patterns = [
  "test/**",
  "spec/**",
  "**/*.test.js",
  "**/*.spec.js"
]

[[analyzers]]
name = "ruby"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs", "browser", "vitest"]
  module_system = "es-modules"

[[analyzers]]
name = "docker"
enabled = true

  [analyzers.meta]
  dockerfile_paths = [
    "Dockerfile.dev",
    "Dockerfile.prod"
  ]
