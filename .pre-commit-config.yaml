# https://pre-commit.com
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: legacy-eslint-staged
        name: eslint (legacy Angular, advisory)
        entry: bin/legacy-eslint-staged
        language: script
        files: ^app/assets/javascripts/.*\.js$
        pass_filenames: true
      - id: legacy-prettier-staged
        name: prettier (legacy Angular, advisory)
        entry: bin/legacy-prettier-staged
        language: script
        files: ^app/assets/javascripts/.*\.js$
        pass_filenames: true
      - id: eslint-staged
        name: eslint (app/javascript)
        entry: bin/eslint-staged
        language: script
        files: ^app/javascript/.*\.js$
        pass_filenames: true
      - id: prettier-staged
        name: prettier (app/javascript)
        entry: bin/prettier-staged
        language: script
        files: ^app/javascript/.*\.js$
        pass_filenames: true
      - id: stylelint-staged
        name: stylelint
        entry: bin/stylelint-staged
        language: script
        files: app/assets/stylesheets/.*\.css$
        pass_filenames: true
