# https://pre-commit.com
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: eslint-staged
        name: eslint (app/javascript)
        entry: bin/eslint-staged
        language: script
        files: ^app/javascript/.*\.js$
        pass_filenames: true
      - id: prettier-staged
        name: prettier (app/javascript, test/javascript, test/playwright, scripts)
        entry: bin/prettier-staged
        language: script
        files: ^((app|test)/javascript/.*\.js|(test/playwright|scripts)/.*\.(js|mjs|ts))$
        pass_filenames: true
      - id: stylelint-staged
        name: stylelint + prettier (app/assets/stylesheets)
        entry: bin/stylelint-staged
        language: script
        files: app/assets/stylesheets/.*\.css$
        pass_filenames: true
