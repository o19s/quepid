# https://pre-commit.com
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: jshint-staged
        name: jshint
        entry: bin/jshint-staged
        language: script
        files: \.js$
        pass_filenames: true
      - id: stylelint-staged
        name: stylelint
        entry: bin/stylelint-staged
        language: script
        files: app/assets/stylesheets/.*\.css$
        pass_filenames: true
