name: mutation-tests

on:
  workflow_dispatch:     # Manual trigger only

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build frontend test image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.dev
          tags: quepid-mutation-ci
          load: true
          cache-from: type=gha,scope=dev-image
      - name: Install frontend dependencies
        run: |
          cp config/database.yml.sample config/database.yml
          docker run --rm -v "$PWD:/srv/app" quepid-mutation-ci yarn install --frozen-lockfile
      - name: Mutation tests
        # Fails below the break threshold in test/mutation/nightly.config.mjs.
        # No database, identity provider, search endpoint or LLM service is needed.
        run: |
          docker run --rm --network none -v "$PWD:/srv/app" \
            -e CI=true \
            quepid-mutation-ci yarn test:mutation:nightly
