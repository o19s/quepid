name: quepid-unit-tests
on: push
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build frontend test image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.dev
          tags: quepid-frontend-ci
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max
      - name: Install frontend dependencies
        run: |
          cp config/database.yml.sample config/database.yml
          docker run --rm -v "$PWD:/srv/app" quepid-frontend-ci yarn install --frozen-lockfile
      - name: Frontend tests and lint
        # No database, identity provider, search endpoint or LLM service is needed.
        run: |
          docker run --rm --network none -v "$PWD:/srv/app" \
            -e RAILS_ENV=test -e CI=true -e DB_ADAPTER=sqlite3 \
            quepid-frontend-ci bin/rails test:frontend

  # Mirrors the Style and Security steps in config/ci.rb (bin/ci).
  lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.dev
          tags: quepid-lint-ci
          load: true
          cache-from: type=gha,scope=dev-image
      - name: Ruby style, gem audit, importmap audit and Brakeman
        run: |
          cp config/database.yml.sample config/database.yml
          docker run --rm -v "$PWD:/srv/app" -e RAILS_ENV=test -e DB_ADAPTER=sqlite3 \
            quepid-lint-ci sh -c '
              bin/rubocop &&
              bin/bundler-audit check --update &&
              bin/importmap audit &&
              bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error'

  test:
    runs-on: ubuntu-latest
    env:
      DB_ADAPTER: mysql2
    steps:
      - uses: actions/checkout@v7
      - name: Build the stack
        run: bin/setup_docker
      - name: Test
        run: bin/docker r rails test

  test-sqlite:
    runs-on: ubuntu-latest
    env:
      DB_ADAPTER: sqlite3
    steps:
      - uses: actions/checkout@v7
      - name: Build the stack
        run: bin/setup_docker
      - name: Test
        run: bin/docker r rails test

  test-postgresql:
    runs-on: ubuntu-latest
    env:
      DB_ADAPTER: postgresql
    steps:
      - uses: actions/checkout@v7
      - name: Build the stack
        run: bin/setup_docker
      - name: Test
        run: bin/docker r rails test
